schema_version: "0.1"
profile: standards-adoption

semantics:
  allowed_modes:
    - required
    - optional
    - skipped
    - not-applicable
  allowed_statuses:
    - pending
    - in-progress
    - blocked
    - complete
  skipped_requires_reason: true
  not_applicable_requires_reason: true
  required_stage_must_complete_before_release: true

project_lifecycle:
  - id: requirements
    name: "Requirements"
    mode: required
    status: complete
    evidence: ["START_HERE.md", "framework/MODULE_ADOPTION_PLAN.md"]
    reason: "Extend project standards with selectable module implementation blueprints."
  - id: product
    name: "Product"
    mode: required
    status: complete
    evidence: ["framework/ROADMAP.md", "framework/MODULE_ADOPTION_PLAN.md"]
    reason: "Deliver P1.1 blueprints while actual project work and runtimes remain separate."
  - id: ux-user-flows
    name: "UX / User Flows"
    mode: required
    status: complete
    evidence: ["START_HERE.md"]
    reason: "Document empty-directory and existing-project adoption journeys."
  - id: design
    name: "Design"
    mode: not-applicable
    status: complete
    evidence: ["framework/PROJECT_PLAYBOOK.md"]
    reason: "This increment delivers text standards without a visual interface."
  - id: architecture
    name: "Architecture"
    mode: required
    status: complete
    evidence: ["templates/project/BOOTSTRAP_MANIFEST.yaml", "framework/MODULE_ADOPTION_PLAN.md"]
    reason: "Adopt design guides and task inputs without copying runtime claims or project gate approvals."
  - id: database
    name: "Database"
    mode: not-applicable
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "No database or migration is changed."
  - id: api
    name: "API"
    mode: not-applicable
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "No runtime API is implemented or changed."
  - id: implementation
    name: "Implementation"
    mode: required
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "This increment adds nine blueprints, project task prompts, template wiring and read-only validation."
  - id: testing
    name: "Testing"
    mode: required
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "Nine standard checks and eight negative fixtures pass with 46 adopted files; Storage static regression passes."
  - id: security
    name: "Security"
    mode: not-applicable
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "Generic security design inputs only; no runtime controls or access configuration change, and project security gates remain unassessed."
  - id: deployment
    name: "Deployment"
    mode: not-applicable
    status: complete
    evidence: ["framework/GITHUB_WORKFLOW.md"]
    reason: "Repository documentation delivery has no service deployment."
  - id: production-gate
    name: "Production Gate"
    mode: not-applicable
    status: complete
    evidence: ["framework/MODULE_ADOPTION_PLAN.md"]
    reason: "No production system or runtime release is in scope."

module_lifecycle:
  states:
    - DRAFT
    - SPEC_READY
    - ARCHITECTURE_READY
    - TASKS_READY
    - IMPLEMENTING
    - TESTING
    - REVIEW
    - ACCEPTED
    - RELEASED
  initial_state: DRAFT
  terminal_state: RELEASED
  transition_policy: sequential-by-default
  transition_evidence_required: true
  constraints:
    - from: DRAFT
      to: SPEC_READY
      gate: spec
    - from: SPEC_READY
      to: ARCHITECTURE_READY
      gate: architecture
      minimum_risk: medium
    - from: ARCHITECTURE_READY
      to: TASKS_READY
      gate: architecture
    - from: TASKS_READY
      to: IMPLEMENTING
      gate: implementation
      evaluation: entry-criteria
    - from: IMPLEMENTING
      to: TESTING
      gate: implementation
      evaluation: exit-criteria
    - from: TESTING
      to: REVIEW
      gate: test
    - from: REVIEW
      to: ACCEPTED
      gate: acceptance
    - from: ACCEPTED
      to: RELEASED
      gate: release

agent_flow:
  - Analyze
  - Plan
  - Implement
  - Test
  - Review
  - Accept
  - Handoff
