schema_version: "0.1"
profile: framework-kernel

semantics:
  allowed_modes:
    - required
    - optional
    - skipped
    - not-applicable
  allowed_statuses:
    - pending
    - in-progress
    - blocked
    - complete
  skipped_requires_reason: true
  not_applicable_requires_reason: true
  required_stage_must_complete_before_release: true

project_lifecycle:
  - id: requirements
    name: Requirements
    mode: required
    status: complete
    evidence:
      - PROJECT_CONTEXT.md
      - README.md
  - id: product
    name: Product
    mode: optional
    status: complete
    evidence:
      - framework/ROADMAP.md
  - id: ux-user-flows
    name: UX / User Flows
    mode: not-applicable
    status: complete
    reason: M0 is a specification kernel with no end-user interface.
  - id: design
    name: Design
    mode: not-applicable
    status: complete
    reason: M0 has no visual product surface.
  - id: architecture
    name: Architecture
    mode: required
    status: complete
    evidence:
      - PROJECT_CONTEXT.md
      - framework/MODULE_STANDARD.md
  - id: database
    name: Database
    mode: not-applicable
    status: complete
    reason: M0 defines no persistence runtime.
  - id: api
    name: API
    mode: optional
    status: complete
    evidence:
      - schemas/module.schema.json
    reason: M0 exposes file contracts rather than a network API.
  - id: implementation
    name: Implementation
    mode: required
    status: complete
    evidence:
      - .agent-project/project.yaml
      - templates/module/module.yaml
  - id: testing
    name: Testing
    mode: required
    status: complete
    evidence:
      - CURRENT_STATUS.md
  - id: security
    name: Security
    mode: optional
    status: complete
    evidence:
      - framework/RISK_MODEL.md
      - templates/module/SECURITY.md
  - id: deployment
    name: Deployment
    mode: skipped
    status: complete
    reason: M0 delivers repository contracts only; no deployable runtime exists.
  - id: production-gate
    name: Production Gate
    mode: not-applicable
    status: complete
    reason: M0 has no production runtime or service.

module_lifecycle:
  states:
    - DRAFT
    - SPEC_READY
    - ARCHITECTURE_READY
    - TASKS_READY
    - IMPLEMENTING
    - TESTING
    - REVIEW
    - ACCEPTED
    - RELEASED
  initial_state: DRAFT
  terminal_state: RELEASED
  transition_policy: sequential-by-default
  transition_evidence_required: true
  constraints:
    - from: DRAFT
      to: SPEC_READY
      gate: spec
    - from: SPEC_READY
      to: ARCHITECTURE_READY
      gate: architecture
      minimum_risk: medium
    - from: ARCHITECTURE_READY
      to: TASKS_READY
      gate: architecture
    - from: TASKS_READY
      to: IMPLEMENTING
      gate: implementation
    - from: IMPLEMENTING
      to: TESTING
      gate: implementation
    - from: TESTING
      to: REVIEW
      gate: test
    - from: REVIEW
      to: ACCEPTED
      gate: acceptance
    - from: ACCEPTED
      to: RELEASED
      gate: release

agent_flow:
  - Analyze
  - Plan
  - Implement
  - Test
  - Review
  - Accept
  - Handoff

