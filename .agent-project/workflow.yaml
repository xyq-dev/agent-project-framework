schema_version: "0.1"
profile: storage-reference-runtime

semantics:
  allowed_modes:
    - required
    - optional
    - skipped
    - not-applicable
  allowed_statuses:
    - pending
    - in-progress
    - blocked
    - complete
  skipped_requires_reason: true
  not_applicable_requires_reason: true
  required_stage_must_complete_before_release: true

project_lifecycle:
  - id: requirements
    name: "Requirements"
    mode: required
    status: complete
    evidence: ["modules/storage/SPEC.md","modules/storage/TASKS.md"]
    reason: "User resumed Core/Memory/Local/OSS reference development."
  - id: product
    name: "Product"
    mode: required
    status: complete
    evidence: ["modules/storage/SPEC.md","modules/storage/STORAGE_M1_B_IMPLEMENTATION_REPORT.md"]
    reason: "Deliver optional reference runtime without changing new-project adoption defaults."
  - id: ux-user-flows
    name: "UX / User Flows"
    mode: not-applicable
    status: complete
    evidence: ["modules/storage/API.md"]
    reason: "Library API only; no application user flow is changed."
  - id: design
    name: "Design"
    mode: not-applicable
    status: complete
    evidence: ["modules/storage/SPEC.md"]
    reason: "No visual interface."
  - id: architecture
    name: "Architecture"
    mode: required
    status: complete
    evidence: ["modules/storage/ARCHITECTURE.md","modules/storage/INDEPENDENT_SECURITY_REVIEW.md"]
    reason: "Local ST-005 and OSS-001 conservative profile have independent DESIGN PASS."
  - id: database
    name: "Database"
    mode: not-applicable
    status: complete
    evidence: ["modules/storage/SPEC.md"]
    reason: "No database or migration."
  - id: api
    name: "API"
    mode: required
    status: complete
    evidence: ["modules/storage/API.md","modules/storage/LOCAL_OSS_REVIEW_PACKAGE.md"]
    reason: "Existing Core API retained; conservative OSS capabilities explicitly reject unsupported conditions."
  - id: implementation
    name: "Implementation"
    mode: required
    status: complete
    evidence: ["modules/storage/STORAGE_M1_B_IMPLEMENTATION_REPORT.md"]
    reason: "Core/Memory/Local/OSS initial profiles implemented; final independent security review remains pending."
  - id: testing
    name: "Testing"
    mode: required
    status: in-progress
    evidence: ["modules/storage/validation/runtime-results.json","modules/storage/validation/cases.yaml"]
    reason: "104 tests pass (43 Core/Memory, 29 Local, 32 OSS offline); real OSS NOT_RUN."
  - id: security
    name: "Security"
    mode: required
    status: blocked
    evidence: ["modules/storage/SECURITY.md","modules/storage/LOCAL_OSS_REVIEW_PACKAGE.md"]
    reason: "User-authorized independent reviewer passed designs and reviewed Local first pass; final implementation review interrupted by agent quota."
  - id: deployment
    name: "Deployment"
    mode: not-applicable
    status: complete
    evidence: ["modules/storage/STORAGE_M1_B_IMPLEMENTATION_REPORT.md"]
    reason: "Private source delivery only; no service deployment or package publication."
  - id: production-gate
    name: "Production Gate"
    mode: not-applicable
    status: complete
    evidence: ["modules/storage/ACCEPTANCE.md"]
    reason: "Production release is outside this reference implementation increment; no runtime release approval."

module_lifecycle:
  states:
    - DRAFT
    - SPEC_READY
    - ARCHITECTURE_READY
    - TASKS_READY
    - IMPLEMENTING
    - TESTING
    - REVIEW
    - ACCEPTED
    - RELEASED
  initial_state: DRAFT
  terminal_state: RELEASED
  transition_policy: sequential-by-default
  transition_evidence_required: true
  constraints:
    - from: DRAFT
      to: SPEC_READY
      gate: spec
    - from: SPEC_READY
      to: ARCHITECTURE_READY
      gate: architecture
      minimum_risk: medium
    - from: ARCHITECTURE_READY
      to: TASKS_READY
      gate: architecture
    - from: TASKS_READY
      to: IMPLEMENTING
      gate: implementation
      evaluation: entry-criteria
    - from: IMPLEMENTING
      to: TESTING
      gate: implementation
      evaluation: exit-criteria
    - from: TESTING
      to: REVIEW
      gate: test
    - from: REVIEW
      to: ACCEPTED
      gate: acceptance
    - from: ACCEPTED
      to: RELEASED
      gate: release

agent_flow:
  - Analyze
  - Plan
  - Implement
  - Test
  - Review
  - Accept
  - Handoff
