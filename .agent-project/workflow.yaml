schema_version: "0.1"
profile: storage-reference

semantics:
  allowed_modes:
    - required
    - optional
    - skipped
    - not-applicable
  allowed_statuses:
    - pending
    - in-progress
    - blocked
    - complete
  skipped_requires_reason: true
  not_applicable_requires_reason: true
  required_stage_must_complete_before_release: true

project_lifecycle:
  - id: requirements
    name: Requirements
    mode: required
    status: complete
    evidence:
      - modules/storage/SPEC.md
  - id: product
    name: Product
    mode: optional
    status: complete
    evidence:
      - framework/ROADMAP.md
    reason: M1 uses a module capability scope rather than a separate product specification.
  - id: ux-user-flows
    name: UX / User Flows
    mode: not-applicable
    status: complete
    reason: Storage is a library contract with no end-user interface.
  - id: design
    name: Design
    mode: not-applicable
    status: complete
    reason: Storage has no visual product surface.
  - id: architecture
    name: Architecture
    mode: required
    status: complete
    evidence:
      - modules/storage/ARCHITECTURE.md
      - modules/storage/REVIEW.md
  - id: database
    name: Database
    mode: not-applicable
    status: complete
    reason: Storage owns object bytes, not a database schema; local record format is specified separately.
  - id: api
    name: API
    mode: required
    status: complete
    evidence:
      - modules/storage/API.md
    reason: Storage exposes a library API, not HTTP endpoints.
  - id: implementation
    name: Implementation
    mode: required
    status: pending
    evidence: []
  - id: testing
    name: Testing
    mode: required
    status: pending
    evidence: []
    reason: M1-A static specification validation is not Runtime Test Gate evidence.
  - id: security
    name: Security
    mode: required
    status: pending
    evidence: []
    reason: Threat design exists; implemented controls and Local independent review remain pending.
  - id: deployment
    name: Deployment
    mode: not-applicable
    status: complete
    reason: M1 reference work has no service deployment; package publishing is a separate authorization.
  - id: production-gate
    name: Production Gate
    mode: not-applicable
    status: complete
    reason: M1 does not target production data or services; Module Release Gate still applies to future distribution.

module_lifecycle:
  states:
    - DRAFT
    - SPEC_READY
    - ARCHITECTURE_READY
    - TASKS_READY
    - IMPLEMENTING
    - TESTING
    - REVIEW
    - ACCEPTED
    - RELEASED
  initial_state: DRAFT
  terminal_state: RELEASED
  transition_policy: sequential-by-default
  transition_evidence_required: true
  constraints:
    - from: DRAFT
      to: SPEC_READY
      gate: spec
    - from: SPEC_READY
      to: ARCHITECTURE_READY
      gate: architecture
      minimum_risk: medium
    - from: ARCHITECTURE_READY
      to: TASKS_READY
      gate: architecture
    - from: TASKS_READY
      to: IMPLEMENTING
      gate: implementation
      evaluation: entry-criteria
    - from: IMPLEMENTING
      to: TESTING
      gate: implementation
      evaluation: exit-criteria
    - from: TESTING
      to: REVIEW
      gate: test
    - from: REVIEW
      to: ACCEPTED
      gate: acceptance
    - from: ACCEPTED
      to: RELEASED
      gate: release

agent_flow:
  - Analyze
  - Plan
  - Implement
  - Test
  - Review
  - Accept
  - Handoff
