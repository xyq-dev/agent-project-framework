schema_version: "0.1"
framework_version: "0.1.0-dev"
project:
  id: "{{PROJECT_ID}}"
  name: "{{PROJECT_NAME}}"
  owner: "{{PROJECT_OWNER}}"
  repository: "{{PROJECT_REPOSITORY}}"
  kind: application
  lifecycle_profile: new-project
  risk_baseline: medium
  technology_neutral: true
adoption:
  source_repository: https://github.com/xyq-dev/agent-project-framework
  source_commit: "{{STANDARD_COMMIT}}"
  standard_version: "0.1.0-dev"
  mode: copied-snapshot
contracts:
  agent_instructions: AGENTS.md
  stable_context: PROJECT_CONTEXT.md
  dynamic_status: CURRENT_STATUS.md
  project_plan: docs/PROJECT_PLAN.md
  workflow: .agent-project/workflow.yaml
  agents: .agent-project/agents.yaml
  gates: .agent-project/gates.yaml
  module_standard: framework/MODULE_STANDARD.md
  module_schema: schemas/module.schema.json
  module_template: templates/module
  module_adoption_plan: framework/MODULE_ADOPTION_PLAN.md
  module_blueprint_catalog: playbooks/modules/catalog.yaml
catalog_roots:
  infrastructure_modules: modules
  business_modules: business-modules
  presets: presets
  examples: examples
selected_modules: []
policies:
  create_empty_catalog_directories: false
  require_explicit_dependencies: true
  require_status_handoff: true
  runtime_implementation_coupled_to_contract: false
