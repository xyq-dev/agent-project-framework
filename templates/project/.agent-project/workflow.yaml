schema_version: "0.1"
profile: new-project

semantics:
  allowed_modes:
    - required
    - optional
    - skipped
    - not-applicable
  allowed_statuses:
    - pending
    - in-progress
    - blocked
    - complete
  skipped_requires_reason: true
  not_applicable_requires_reason: true
  required_stage_must_complete_before_release: true

# Initial defaults: assess applicability during project initiation; no phase has passed.
project_lifecycle:
  - id: requirements
    name: "Requirements"
    mode: required
    status: pending
    evidence: []
  - id: product
    name: "Product"
    mode: required
    status: pending
    evidence: []
  - id: ux-user-flows
    name: "UX / User Flows"
    mode: required
    status: pending
    evidence: []
  - id: design
    name: "Design"
    mode: required
    status: pending
    evidence: []
  - id: architecture
    name: "Architecture"
    mode: required
    status: pending
    evidence: []
  - id: database
    name: "Database"
    mode: required
    status: pending
    evidence: []
  - id: api
    name: "API"
    mode: required
    status: pending
    evidence: []
  - id: implementation
    name: "Implementation"
    mode: required
    status: pending
    evidence: []
  - id: testing
    name: "Testing"
    mode: required
    status: pending
    evidence: []
  - id: security
    name: "Security"
    mode: required
    status: pending
    evidence: []
  - id: deployment
    name: "Deployment"
    mode: required
    status: pending
    evidence: []
  - id: production-gate
    name: "Production Gate"
    mode: required
    status: pending
    evidence: []

module_lifecycle:
  states:
    - DRAFT
    - SPEC_READY
    - ARCHITECTURE_READY
    - TASKS_READY
    - IMPLEMENTING
    - TESTING
    - REVIEW
    - ACCEPTED
    - RELEASED
  initial_state: DRAFT
  terminal_state: RELEASED
  transition_policy: sequential-by-default
  transition_evidence_required: true
  constraints:
    - from: DRAFT
      to: SPEC_READY
      gate: spec
    - from: SPEC_READY
      to: ARCHITECTURE_READY
      gate: architecture
      minimum_risk: medium
    - from: ARCHITECTURE_READY
      to: TASKS_READY
      gate: architecture
    - from: TASKS_READY
      to: IMPLEMENTING
      gate: implementation
      evaluation: entry-criteria
    - from: IMPLEMENTING
      to: TESTING
      gate: implementation
      evaluation: exit-criteria
    - from: TESTING
      to: REVIEW
      gate: test
    - from: REVIEW
      to: ACCEPTED
      gate: acceptance
    - from: ACCEPTED
      to: RELEASED
      gate: release

agent_flow:
  - Analyze
  - Plan
  - Implement
  - Test
  - Review
  - Accept
  - Handoff
